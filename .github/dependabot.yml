version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: quarterly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    actions:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
