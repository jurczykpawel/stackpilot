name: Unit & Static Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'local/**'
      - 'system/**'
      - 'apps/**'
      - 'locale/**'
      - 'tests/**'
      - '.github/workflows/test-unit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'local/**'
      - 'system/**'
      - 'apps/**'
      - 'locale/**'
      - 'tests/**'

jobs:
  test:
    name: Unit & Static Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test tools
        run: sudo apt-get install -y shellcheck gettext-base

      - name: Run unit tests
        run: bash tests/run.sh unit --verbose

      - name: Run static tests
        run: bash tests/run.sh static --verbose

      - name: Verify Plunk gateway routing across address changes
        run: bash tests/e2e/plunk-gateway.sh
