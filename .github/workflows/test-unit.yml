name: Unit & Static Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'local/**'
      - 'system/**'
      - 'apps/**'
      - 'locale/**'
      - 'tests/**'
      - '.githooks/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'local/**'
      - 'system/**'
      - 'apps/**'
      - 'locale/**'
      - 'tests/**'
      - '.githooks/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Unit & Static Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test tools
        run: sudo apt-get install -y shellcheck gettext-base

      - name: Run unit tests
        run: bash tests/run.sh unit --verbose

      - name: Run static tests
        run: bash tests/run.sh static --verbose

      - name: Verify Plunk gateway routing across address changes
        run: bash tests/e2e/plunk-gateway.sh
