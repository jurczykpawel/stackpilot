name: E2E Integration Tests

on:
  workflow_dispatch:
    inputs:
      ssh_host:
        description: 'SSH alias for test server'
        required: true
        default: 'test-vps'
      suite:
        description: 'E2E suite (leave empty for all)'
        required: false
      quick:
        description: 'Quick mode (1 variant per app)'
        type: boolean
        default: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_KEY }}
          SSH_HOST: ${{ github.event.inputs.ssh_host || 'test-vps' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run E2E tests
        env:
          SSH_HOST: ${{ github.event.inputs.ssh_host || 'test-vps' }}
          SUITE: ${{ github.event.inputs.suite || '' }}
          QUICK: ${{ github.event.inputs.quick && '--quick' || '' }}
        run: |
          args=(e2e "--ssh=$SSH_HOST")
          if [ -n "$SUITE" ]; then args+=("--suite=$SUITE"); fi
          if [ -n "$QUICK" ]; then args+=("$QUICK"); fi
          bash tests/run.sh "${args[@]}" --verbose
